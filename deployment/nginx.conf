# ==============================================================================
# Production Nginx Configuration for B2B Supermarket
# Place in /etc/nginx/sites-available/supermarket.conf and symlink to sites-enabled
# ==============================================================================

# Rate limit zones (must live in the http{} context, which this file is included
# into). PM2 runs the backend in cluster mode with multiple workers, so the
# in-process rate limiter in backend/middleware/rateLimiter.js only sees a
# fraction of requests per worker — these zones enforce a real, global limit
# per client IP in front of all workers.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=register_limit:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=verify_limit:10m rate=10r/m;

# Hide the nginx version from response headers and default error pages
server_tokens off;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.de www.yourdomain.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.de www.yourdomain.de;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Reject overly large request bodies (this app has no file uploads; 2m is generous headroom)
    client_max_body_size 2m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    # img-src/font-src allow https: broadly because product images, the store logo and
    # Google review avatars are admin-entered URLs, not a fixed set of domains.
    # script-src/frame-src include Trustindex's widget domains as placeholders — verify
    # against Trustindex's actual embed snippet before enabling trustindexWidgetCode.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.trustindex.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://www.google.com https://www.trustindex.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # Gzip Compression for maximum performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Frontend Static Files
    root /var/www/supermarket/frontend/dist;
    index index.html;

    # Vite hashed assets caching (1 year immutable cache)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Never cache the entry HTML so a deploy doesn't leave returning visitors on a stale bundle
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Rate-limited auth endpoints (checked before the general /api/ proxy below)
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/customer/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/customer/register {
        limit_req zone=register_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/customer/(verify-email|verify-phone|resend-otp|request-password-reset|reset-password)$ {
        limit_req zone=verify_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Proxy to Express Backend (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA Routing (Redirect all other requests to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
