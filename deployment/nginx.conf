# ==============================================================================
# Production Nginx Configuration for B2B Supermarket
# Place in /etc/nginx/sites-available/supermarket.conf and symlink to sites-enabled
# ==============================================================================

# Rate limit zones (must live in the http{} context, which this file is included
# into). PM2 runs the backend in cluster mode with multiple workers, so the
# in-process rate limiter in backend/middleware/rateLimiter.js only sees a
# fraction of requests per worker — these zones enforce a real, global limit
# per client IP in front of all workers.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=register_limit:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=verify_limit:10m rate=10r/m;

# Hide the nginx version from response headers and default error pages
server_tokens off;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.de www.yourdomain.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.de www.yourdomain.de;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Reject overly large request bodies (this app has no file uploads; 2m is generous headroom)
    client_max_body_size 2m;

    # Security Headers
    #
    # nginx only inherits these into a location that has NO add_header of its
    # own — a single add_header inside a location silently drops all of them
    # for that location. Set caching with `expires` in locations instead (as
    # below), or repeat this whole block there.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    # img-src allows https: broadly because product images, the store logo and
    # Google review avatars are admin-entered URLs, not a fixed set of domains.
    # Third-party origins the frontend actually needs:
    #   - fonts.googleapis.com / fonts.gstatic.com: the Cairo font in index.html
    #   - www.google.com / maps.google.com frames: the Settings map embed
    # (Phone verification codes go out via WhatsApp from the backend, so the
    # browser needs no third-party origin for it.)
    # script-src/frame-src also include Trustindex's widget domains as placeholders —
    # verify against Trustindex's actual embed snippet before enabling trustindexWidgetCode.
    # After changing this, place a test order through signup + phone verification
    # on staging with the browser console open: a CSP violation there blocks all ordering.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.trustindex.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' https://www.google.com https://maps.google.com https://www.trustindex.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # Gzip Compression for maximum performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Frontend Static Files
    root /var/www/supermarket/frontend/dist;
    index index.html;

    # Vite hashed assets caching (file names change on every build). `expires`
    # instead of add_header Cache-Control, so the security headers above still apply.
    location /assets/ {
        expires max;
        access_log off;
    }

    # Never cache the entry HTML so a deploy doesn't leave returning visitors on a stale bundle.
    # Every page load ends up here (the SPA fallback below redirects to /index.html), so this
    # location must not use add_header — `expires epoch` sends "Cache-Control: no-cache".
    location = /index.html {
        expires epoch;
        try_files /index.html =404;
    }

    # Rate-limited auth endpoints (regex locations win over the /api/ prefix
    # location below). Customer auth lives only under /api/customer.
    # backend/tests/nginxRateLimits.test.js fails if a backend route that
    # guards against password/code/PIN guessing has no rule here. `~*` and the
    # optional trailing slash match Express, which routes case-insensitively
    # and ignores a trailing slash.

    # Logins: admin, customer and driver
    location ~* ^/api/(auth|customer|settings/driver)/login/?$ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/api/customer/register/?$ {
        limit_req zone=register_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # One-time codes, password resets, the admin 2FA code and the section PIN
    location ~* ^/api/(customer/(verify-email|verify-phone|resend-otp|request-password-reset|reset-password)|auth/(verify-2fa|resend-2fa)|settings/passcode/verify)/?$ {
        limit_req zone=verify_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Proxy to Express Backend (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA Routing (Redirect all other requests to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
